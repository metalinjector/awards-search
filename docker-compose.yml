# Значения ${...} берутся из файла .env рядом (см. .env.example); все необязательны.
services:
  db:
    image: postgres:16-alpine
    container_name: awards-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Пароль применяется только при первом создании тома pgdata.
      # Сменить его у существующей базы: ALTER USER postgres PASSWORD '...'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    container_name: awards
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/app_db
      # Токен администратора: без него ключ TMDB через интерфейс не сохранить и не удалить
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Необязательные ключи внешних сервисов
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
    networks:
      - internal
      - web
    # Порт наружу не публикуем — доступ только через Caddy (awards.zonner.site).
    expose:
      - "3000"

networks:
  internal:
  web:
    external: true

volumes:
  pgdata:
